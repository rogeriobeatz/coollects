name: Coollects Next.js checks
on:
  pull_request:
    paths: ['next-app/**','.github/workflows/next-app.yml']
  push:
    branches: [main]
    paths: ['next-app/**','.github/workflows/next-app.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    # Synthetic, non-working values only for rendering the unauthenticated pages.
    # Real backend interactions require separate staging/production acceptance tests.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-key-not-for-production
      # Enables the AI capture UI; browser tests mock /api/recognize.
      KIE_API_KEY: ci-dummy-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Unit tests and release copy
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: HTTP smoke test all public routes
        run: |
          ./node_modules/.bin/next start -p 3200 >/tmp/coollects-open.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          node scripts/smoke-pages.mjs 3200
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests on 320px and 390px
        run: |
          ./node_modules/.bin/next start -p 3202 >/tmp/coollects-browser.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          npm run test:browser
