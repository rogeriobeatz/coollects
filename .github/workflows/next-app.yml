name: Coollects Next.js checks
on:
  pull_request:
    paths: ['next-app/**','.github/workflows/next-app.yml']
  push:
    branches: [main]
    paths: ['next-app/**','.github/workflows/next-app.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Print dependency security report
        run: |
          npm audit --json > audit-report.json || true
          node -e "const r=require('./audit-report.json'); for(const [name,v] of Object.entries(r.vulnerabilities||{})){console.log(name+' '+v.severity+' '+v.range+' fix='+JSON.stringify(v.fixAvailable))}"
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
